<body class="ar bg-slate-50 text-slate-800" id="body-tag">

<header class="bg-navy-950 border-b border-navy-800 sticky top-0 z-40 text-white">
<div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
  <div class="flex items-center gap-3">
    <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1F5F7E"/><stop offset="1" stop-color="#7FE0C8"/></linearGradient></defs><path d="M3 34 L12 8 L20 24 L28 6 L37 34 L30 34 L27 20 L20 34 L14 22 L10 34 Z" fill="url(#g)"/></svg>

  </div>
  <div class="flex items-center gap-3">
    <button onclick="setLang(S.settings.lang==='ar'?'en':'ar')" id="lang-btn" class="bg-navy-800 hover:bg-teal-brand hover:text-navy-950 text-xs px-3 py-1.5 rounded-md font-semibold transition"></button>
    <div class="relative">
      <button id="avatar-btn" onclick="toggleMenu(event)" aria-haspopup="true" aria-expanded="false" aria-label="Account" class="w-10 h-10 rounded-full bg-teal-brand text-navy-950 flex items-center justify-center hover:ring-2 hover:ring-teal-soft transition">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></button>

        <div class="p-4 bg-navy-900 text-white"><div id="m-name" class="font-bold text-sm"></div><div id="m-email" class="text-xs text-teal-soft mt-0.5"></div><div id="m-type" class="text-[11px] mt-2 inline-block bg-navy-800 rounded px-2 py-0.5"></div></div>
        <ul class="text-sm py-1">

      </div>
    </div>
  </div>
</div>
</header>

<main class="max-w-7xl mx-auto px-4 py-8">
  <div class="mb-8"><h1 class="text-2xl font-bold text-navy-900" data-i="welcome_title"></h1><p class="text-slate-600 text-sm mt-1" data-i="welcome_desc"></p></div>
  <div id="stats" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6"></div>
  <div id="alert" class="mb-6"></div>

  <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 mb-8">
    <h3 class="font-bold text-navy-900 text-base mb-1" data-i="chat_header"></h3>
    <p class="text-xs text-slate-500 mb-4" data-i="chat_sub"></p>
    <div id="chat-log" class="bg-slate-50 border border-slate-200 rounded-lg p-4 h-64 overflow-y-auto mb-3 space-y-3 text-xs" aria-live="polite"></div>
    <div id="chips" class="flex flex-wrap gap-2 mb-2"></div>
    <div id="key-hint" class="text-[11px] text-slate-500 mb-3"></div>
    <div class="flex gap-2">
      <input id="chat-in" onkeydown="if(event.key==='Enter')sendChat()" class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-4 py-2.5 text-xs focus:outline-none focus:border-navy-700">
      <button id="send-btn" onclick="sendChat()" class="bg-navy-900 hover:bg-navy-700 disabled:opacity-50 text-white px-6 py-2.5 rounded-lg text-xs font-bold transition" data-i="btn_send"></button>
    </div>
  </section>

  <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
 <div class="px-4 py-3 border-b border-slate-200 flex flex-wrap justify-between items-center gap-2">
  <div><h3 class="font-bold text-navy-900" data-i="table_header"></h3><span class="text-xs text-slate-500" data-i="table_sub"></span></div>
  <div class="flex flex-wrap items-center gap-2"><button onclick="exportCSV()" class="border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs px-3 py-1.5 rounded-lg font-semibold" data-i="exp_csv"></button>
   <button onclick="openCompany()" class="bg-navy-900 hover:bg-navy-700 text-white text-xs px-4 py-1.5 rounded-lg font-bold transition" data-i="btn_add"></button></div></div>
 <div class="overflow-x-auto"><table class="w-full border-collapse"><thead id="thead"></thead><tbody id="rows" class="text-xs divide-y divide-slate-100"></tbody></table></div>
</section>
</main>

<div id="modal" class="hidden fixed inset-0 z-50 bg-navy-950/70 flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">

    <div class="px-5 py-3 border-b border-slate-200 flex justify-between items-center"><h2 id="m-title" class="font-bold text-navy-900"></h2><button onclick="closeModal()" aria-label="Close" class="text-slate-400 hover:text-slate-700 text-xl leading-none">&times;</button></div>
    <div id="m-body" class="px-5 py-4 overflow-y-auto text-sm"></div>
    <div id="m-foot" class="px-5 py-3 border-t border-slate-200 flex flex-wrap justify-end gap-2"></div>
  </div>
</div>
<div id="print-root" class="hidden"></div>
<div id="toast" class="hidden fixed bottom-6 start-1/2 -translate-x-1/2 z-[60] bg-navy-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg"></div>

</div>

 const C=S.companies,B=S.settings.cur,hi=C.filter(c=>lvl(c)==='high'),cash=C.reduce((a,c)=>a+toBase(c.cash,c),0),net=C.reduce((a,c)=>a+Math.max(0,toBase(M(c).net,c)),0);
 const card=(b,l,v,vc,s)=>`<div class="bg-white p-4 rounded-xl border border-slate-200 border-t-4 ${b} shadow-sm"><p class="text-xs text-slate-500 font-medium">${l}</p><h3 class="text-2xl font-bold ${vc} mt-1">${v}</h3><span class="text-xs ${vc} inline-block font-semibold">${s}</span></div>`;
 $('stats').innerHTML=(()=>{const f=C.map(c=>M(c).run).filter(isFinite),a=f.length?f.reduce((p,q)=>p+q,0)/f.length:0;return card('border-t-teal-brand',t('s1'),C.length,'text-navy-900',t('s1s'))+card(hi.length?'border-t-red-600':'border-t-emerald-500',t('s2'),hi.length,hi.length?'text-red-700':'text-emerald-700',t('s2s'))+card('border-t-navy-700',t('s3'),fmt(a),'text-navy-700',t('s3s'))})();
 const ord={high:0,med:1,low:2},al=C.flatMap(c=>alertsOf(c).map(a=>({c,...a}))).sort((x,y)=>ord[x.s]-ord[y.s]),dot={high:'bg-red-500',med:'bg-amber-400',low:'bg-slate-400'};
 const bt='text-xs px-3 py-1.5 rounded-lg transition ';
 $('alert').innerHTML=`<div class="bg-navy-900 rounded-2xl p-4 text-white shadow-lg border border-navy-800 border-s-4 ${hi.length?'border-s-red-500':'border-s-teal-brand'}"><div class="flex flex-wrap items-center gap-3 mb-3"><span class="bg-teal-brand text-navy-950 text-xs px-3 py-1 rounded-md font-bold">${t('al_badge')}</span><h2 class="text-base font-bold">${t('al_title')}</h2></div><div class="space-y-2">`+
 (!S.settings.notif?`<p class="text-xs text-slate-300">${t('al_off')}</p>`:al.length?al.slice(0,3).map(a=>`<div class="bg-navy-800/70 rounded-lg p-3 border border-teal-brand/20 flex flex-wrap items-center justify-between gap-2"><div class="flex items-start gap-2 min-w-0"><span class="mt-1.5 w-2 h-2 rounded-full ${dot[a.s]} shrink-0"></span><div><div class="text-sm font-bold text-teal-soft">${esc(nm(a.c))}</div><div class="text-xs text-slate-200">${esc(t(a.k,a.v))}</div></div></div><div class="flex gap-2"><button onclick="openPlan('${a.c.id}')" class="${bt}bg-teal-brand hover:bg-teal-soft text-navy-950 font-bold">${t('btn_plan')}</button><button onclick="openContact('${a.c.id}')" class="${bt}border border-teal-brand hover:bg-white/10">${t('btn_contact')}</button></div></div>`).join(''):`<p class="text-xs text-teal-soft">${t('al_none')}</p>`)+`</div></div>`;
 const rows=C.slice().sort((a,b)=>risk(b).score-risk(a).score),thc='py-2 px-3 text-start font-semibold';
 $('thead').innerHTML=`<tr class="bg-slate-50 text-slate-500 text-xs border-b border-slate-200"><th class="${thc}">${t('th_company')}</th><th class="${thc}">${t('th_runway')}</th><th class="${thc}">${t('th_status')}</th><th class="${thc} act"></th></tr>`;
 $('rows').innerHTML=rows.map(c=>{const m=M(c),s=ST[lvl(c)];return `<tr class="hover:bg-slate-50 cursor-pointer" onclick="openReport('${c.id}')"><td class="py-3 px-3"><div class="font-semibold text-navy-900">${esc(nm(c))}</div><div class="text-slate-500">${t(c.sector)}</div></td><td class="py-3 px-3 font-bold ${s[1]} whitespace-nowrap">${isFinite(m.run)?fmt(m.run)+' '+t('mo'):t('profit')}</td><td class="py-3 px-3"><span class="${s[0]} px-2 py-0.5 rounded font-semibold whitespace-nowrap">${t(s[2])}</span></td><td class="py-3 px-3 act"><button class="bg-navy-900 hover:bg-navy-700 text-white px-3 py-1.5 rounded-lg font-bold" onclick="event.stopPropagation();openReport('${c.id}')">${t('btn_details')}</button></td></tr>`}).join('');
 $('chips').innerHTML=[1,2,3,4].map(i=>`<button onclick="preset(${i})" class="text-[11px] border border-slate-300 hover:border-navy-700 hover:bg-slate-50 text-slate-600 px-3 py-1.5 rounded-full text-start">${t('q'+i)}</button>`).join('');
 $('key-hint').innerHTML=S.settings.apiKey?'':`${t('key_hint')} <button onclick="openSettings()" class="text-navy-700 underline font-semibold">${t('key_add')}</button>`;
 const log=$('chat-log');if(!log.children.length)addMsg('ai',t('chat_hello'),true);
 log.querySelectorAll('[data-who]').forEach(d=>d.children[0].textContent=d.dataset.who==='ai'?t('chat_ai'):t('chat_you'));
 const h=log.querySelector('[data-hello]');if(h)h.children[1].textContent=t('chat_hello');
}
function setLang(l){S.settings.lang=l;save();render();if(!$('modal').classList.contains('hidden'))closeModal()}

/* ---------- Chat ---------- */
let hist=[];
function addMsg(who,text,hello){const ai=who==='ai',d=document.createElement('div');d.dataset.who=who;if(hello)d.dataset.hello=1;
 d.className='flex items-start gap-2'+(ai?'':' flex-row-reverse');
 d.innerHTML=`<div class="${ai?'bg-navy-900 text-white':'bg-teal-brand text-navy-950'} px-2 py-1 rounded font-bold whitespace-nowrap"></div><div class="bg-white p-3 rounded-lg border border-slate-200 text-slate-700 whitespace-pre-wrap max-w-[85%]"></div>`;
 d.children[0].textContent=ai?t('chat_ai'):t('chat_you');d.children[1].textContent=text;$('chat-log').appendChild(d);$('chat-log').scrollTop=1e9;return d.children[1]}
async function sendChat(q){
 const inp=$('chat-in');q=(typeof q==='string'?q:inp.value).trim();if(!q||$('send-btn').disabled)return;
 inp.value='';addMsg('user',q);const out=addMsg('ai',t('thinking'));$('send-btn').disabled=true;
 const transcript=hist.slice(-8).map(m=>(m.r==='u'?'User: ':'Analyst: ')+m.x).join('\n');
 try{const r=await ask((transcript?'Conversation so far:\n'+transcript+'\n\n':'')+'User question: '+q+'\n\nAnswer the question as the analyst.',x=>{out.textContent=x;$('chat-log').scrollTop=1e9});
  out.textContent=r;hist.push({r:'u',x:q},{r:'a',x:r})}catch(e){out.textContent=errMsg(e)}
 $('send-btn').disabled=false}

function preset(i){addMsg('user',t('q'+i));addMsg('ai',t('a'+i))}
/* ---------- Recommendations / plan ---------- */
function analysis(titleKey,id,instr){
 const c=S.companies.find(x=>x.id===id);if(!c)return;
 openModal(t(titleKey,{n:nm(c)}),`<div id="an" class="whitespace-pre-wrap leading-relaxed text-slate-700"></div>`,[{label:t('regen'),fn:()=>run()},{label:t('close'),cls:P,fn:closeModal}]);
 async function run(){ctl&&ctl.abort();ctl=new AbortController();const el=$('an');el.textContent=t('thinking');
  const d='Company data: '+JSON.stringify(brief(c))+'.';
  try{el.textContent=await ask(d+'\n'+instr,x=>{el.textContent=x},ctl.signal)}catch(e){if(e.name!=='AbortError')el.textContent=errMsg(e)}}
 run()}
const openRecs=id=>analysis('recs_t',id,'Give 4 to 5 prioritized, specific recommendations for this company based on its figures, each with a one-line rationale.');
const openPlan=id=>analysis('plan_t',id,'Write a staged mitigation plan: immediate actions (0 to 30 days), short term (30 to 90 days), and a financing or restructuring path. Quantify targets (for example the burn reduction needed to reach a 6-month runway) from the figures given.');

/* ---------- Contact ---------- */
function openContact(id){
 const opts=S.companies.map(c=>`<option value="${c.id}" ${c.id===id?'selected':''}>${esc(nm(c))}</option>`).join('');
 openModal(t('contact_t'),`<label class="block mb-3 text-xs font-semibold text-slate-600">${t('f_company')}<select id="k-co" class="${inp} mt-1 font-normal">${opts}</select></label>${fld('k-sub',t('f_subject'),t('subj_def'))}
 <label class="block text-xs font-semibold text-slate-600">${t('f_msg')}<textarea id="k-msg" rows="7" class="${inp} mt-1 font-normal"></textarea></label>`,
 [{label:t('f_draft'),fn:draft},{label:t('f_send'),cls:P,fn:send}]);
 async function draft(){const c=S.companies.find(x=>x.id===$('k-co').value),m=$('k-msg');m.value=t('drafting');ctl&&ctl.abort();ctl=new AbortController();
  try{m.value=await ask(`Draft a formal message from the fund to the management of ${nm(c)} (cash ${c.cash}, net monthly burn ${Math.round(M(c).net)}, runway ${runway(c).toFixed(1)} months) requesting a call and an updated cash forecast. Subject: ${$('k-sub').value}. Output only the message body.`,x=>{m.value=x},ctl.signal)}catch(e){m.value=e.name==='AbortError'?'':errMsg(e)}}
 function send(){const c=S.companies.find(x=>x.id===$('k-co').value);if(!c.email){toast(t('no_mail'));return}
  location.href='mailto:'+encodeURIComponent(c.email)+'?subject='+encodeURIComponent($('k-sub').value)+'&body='+encodeURIComponent($('k-msg').value)}}

/* ---------- Company edit ---------- */
function openCompany(id){
 const c=S.companies.find(x=>x.id===id)||mk('','','','sec_other',{cur:S.settings.cur,opex:'',cash:'',gm:50,comp:{}});
 const so=SECT.map(k=>`<option value="${k}" ${k===c.sector?'selected':''}>${t(k)}</option>`).join(''),co=curs().map(k=>`<option ${k===c.cur?'selected':''}>${k}</option>`).join(''),sr=['src_acc','src_bank','src_mgmt','src_man'].map(k=>`<option value="${k}" ${k===c.src?'selected':''}>${t(k)}</option>`).join('');
 const sel=(i,l,o)=>`<label class="block mb-2 text-xs font-semibold text-slate-600">${l}<select id="${i}" class="${inp} mt-1 font-normal">${o}</select></label>`;
 const nf=(k,l)=>fld('e-'+k,t(l),c[k],'number','step="any"'),g3=h=>`<div class="grid grid-cols-2 md:grid-cols-3 gap-x-3">${h}</div>`,hh=k=>`<div class="font-bold text-navy-900 text-xs mt-2 mb-1 border-b border-slate-200 pb-1">${t(k)}</div>`;
 const cp=['reg','audit','tax','sha','kyc'].map(k=>`<label class="flex items-center gap-2 text-xs"><input id="e-cp-${k}" type="checkbox" ${c.comp&&c.comp[k]?'checked':''}> ${t('cp_'+k)}</label>`).join('');
 const acts=[{label:t('cancel'),fn:closeModal},{label:t('save'),cls:P,fn:save1}];
 if(id)acts.unshift({label:t('del'),cls:'border border-red-300 text-red-700 hover:bg-red-50 me-auto',fn:()=>{if(confirm(t('del_q'))){S.companies=S.companies.filter(x=>x.id!==id);save();render();closeModal();toast(t('deleted'))}}});
 openModal(id?t('co_edit'):t('co_new'),g3(fld('e-ar',t('f_name_ar'),c.ar)+fld('e-en',t('f_name_en'),c.en)+sel('e-sec',t('th_sector'),so))+g3(nf('cash','f_cash')+nf('rev','f_rev_in')+nf('opex','f_opex'))+`<p class="text-[11px] text-slate-500 mb-2">${t('ed_hint')}</p><details class="border border-slate-200 rounded-lg"><summary class="cursor-pointer px-3 py-2 text-xs font-bold text-navy-900">${t('ed_more')}</summary><div class="px-3 pb-3">`+
 g3(sel('e-cur',t('f_cur2'),co)+sel('e-src',t('f_src'),sr)+fld('e-upd',t('f_upd'),c.upd,'date'))+hh('ed_fin')+g3(nf('stl','f_stl')+nf('mrr','f_mrr_in')+nf('gm','f_gm_in')+nf('cfo','f_cfo')+nf('cfi','f_cfi')+nf('growth','f_growth'))+
 hh('ed_prev')+g3(nf('pRev','f_prev_rev')+nf('pOpex','f_prev_opex')+nf('pCash','f_prev_cash'))+hh('ed_alert')+g3(nf('aRun','f_a_run')+nf('aRev','f_a_rev')+nf('aBurn','f_a_burn'))+
 hh('ed_comp')+`<div class="grid grid-cols-1 md:grid-cols-2 gap-1 mb-2">${cp}</div>`+fld('e-mail',t('f_email'),c.email,'email')+`</div></details>`,acts,true);
 function save1(){const ar=$('e-ar').value.trim(),en=$('e-en').value.trim(),v=k=>+$('e-'+k).value||0,bl=k=>$('e-'+k).value===''?'':+$('e-'+k).value;
  if(!ar&&!en){toast(t('need_name'));return}if(!(v('opex')>0)){toast(t('need_num'));return}
  const comp={};['reg','audit','tax','sha','kyc'].forEach(k=>comp[k]=$('e-cp-'+k).checked?1:0);
  const o={...c,id:id||'c'+Date.now(),ar:ar||en,en:en||ar,sector:$('e-sec').value,cur:$('e-cur').value,src:$('e-src').value,upd:$('e-upd').value||TODAY,cash:v('cash'),stl:v('stl'),rev:v('rev'),mrr:v('mrr'),gm:v('gm'),opex:v('opex'),cfo:v('cfo'),cfi:v('cfi'),growth:v('growth'),pRev:v('pRev'),pOpex:v('pOpex'),pCash:v('pCash'),aRun:bl('aRun'),aRev:bl('aRev'),aBurn:bl('aBurn'),email:$('e-mail').value.trim(),comp};
  if(id)S.companies=S.companies.map(x=>x.id===id?o:x);else S.companies.push(o);
  save();render();closeModal();toast(t('saved'))}}

/* ---------- Profile / settings / logout ---------- */
function openProfile(){closeMenu();const a=S.account;
 const body=()=>`<div class="mb-4 text-xs font-semibold text-slate-600">${t('f_type')}<div class="flex gap-2 mt-1">${['org','ind'].map(k=>`<button data-ty="${k}" class="flex-1 py-2 rounded-lg border font-semibold ${a.type===k?'bg-navy-900 text-white border-navy-900':'bg-white text-slate-600 border-slate-300'}">${t(k)}</button>`).join('')}</div></div>`+
  (a.type==='org'?fld('p-a',t('o_name'),a.oName)+fld('p-b',t('o_reg'),a.oReg)+fld('p-c',t('o_rep'),a.oRep):fld('p-a',t('i_name'),a.iName)+fld('p-b',t('i_id'),a.iId)+fld('p-c',t('i_phone'),a.phone,'tel'))+fld('p-e',t('f_acc_email'),a.email,'email');
 const keep=()=>{if(!$('p-a'))return;const o=a.type==='org';a[o?'oName':'iName']=$('p-a').value.trim();a[o?'oReg':'iId']=$('p-b').value.trim();a[o?'oRep':'phone']=$('p-c').value.trim();a.email=$('p-e').value.trim()};
 const draw=()=>{$('m-body').innerHTML=body();$('m-body').querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{keep();a.type=b.dataset.ty;draw()})};
 openModal(t('prof_t'),'',[{label:t('cancel'),fn:()=>{S.account=JSON.parse(localStorage.getItem('mv_state')||'null')?.account||DEF.account;closeModal()}},{label:t('save'),cls:P,fn:()=>{keep();save();render();closeModal();toast(t('saved'))}}]);draw()}
function openSettings(){closeMenu();const s=S.settings,note=k=>`<p class="text-[11px] text-slate-500 -mt-1 mb-2">${t(k)}</p>`;
 openModal(t('set_t'),`<label class="block mb-2 text-xs font-semibold text-slate-600">${t('f_lang')}<select id="s-l" class="${inp} mt-1 font-normal"><option value="ar" ${s.lang==='ar'?'selected':''}>العربية</option><option value="en" ${s.lang==='en'?'selected':''}>English</option></select></label>`+
 fld('s-k',t('f_key'),s.apiKey||'','password','autocomplete="off" dir="ltr" placeholder="sk-ant-..."')+note('f_key_h')+
 `<details class="border border-slate-200 rounded-lg"><summary class="cursor-pointer px-3 py-2 text-xs font-bold text-navy-900">${t('ed_more')}</summary><div class="px-3 pb-3 pt-2">`+fld('s-c',t('f_cur'),s.cur)+fld('s-fx',t('f_fx'),s.fx,'text','dir="ltr"')+note('f_fx_h')+
 `<div class="grid grid-cols-3 gap-x-3">${fld('s-t',t('f_thr'),s.thr,'number','min="1"')}${fld('s-r',t('f_a_rev_d'),s.aRev,'number')}${fld('s-b',t('f_a_burn_d'),s.aBurn,'number')}</div>`+note('f_thr_h')+
 `<label class="flex items-center gap-2 text-xs font-semibold text-slate-600"><input id="s-n" type="checkbox" ${s.notif?'checked':''}> ${t('f_notif')}</label></div></details>`,
 [{label:t('cancel'),fn:closeModal},{label:t('save'),cls:P,fn:()=>{s.lang=$('s-l').value;s.cur=($('s-c').value.trim()||'SAR').toUpperCase();s.fx=$('s-fx').value.trim();s.thr=Math.max(1,+$('s-t').value||3);s.aRev=Math.max(1,+$('s-r').value||10);s.aBurn=Math.max(1,+$('s-b').value||15);s.apiKey=$('s-k').value.trim();s.notif=$('s-n').checked;save();render();closeModal();toast(t('saved'))}}])}
function confirmLogout(){closeMenu();openModal(t('out_t'),`<p>${t('out_q')}</p>`,[{label:t('cancel'),fn:closeModal},{label:t('out_btn'),cls:'bg-red-700 hover:bg-red-800 text-white',fn:()=>{closeModal();hist=[];$('chat-log').innerHTML='';$('so-msg').textContent=t('out_msg');$('so-btn').textContent=t('in_btn');$('signed-out').classList.remove('hidden')}}])}
function signIn(){$('signed-out').classList.add('hidden');render()}

function closeMenu(){$('profile-menu').classList.add('hidden');$('avatar-btn').setAttribute('aria-expanded','false')}
function toggleMenu(e){e.stopPropagation();const m=$('profile-menu');m.classList.toggle('hidden');$('avatar-btn').setAttribute('aria-expanded',!m.classList.contains('hidden'))}
document.addEventListener('click',e=>{if(!$('profile-menu').contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();if(!$('modal').classList.contains('hidden'))closeModal()}});
render();
</script>
</body>
</html>
